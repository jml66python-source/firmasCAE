<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firma CAE - DeclaraciÃ³n de Salarios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .contenedor {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0D47A1;
            font-size: 20px;
            margin-top: 0;
            text-align: center;
        }
        .datos-trabajador {
            background-color: #e3f2fd;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .declaracion {
            background-color: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 12px;
            font-size: 13px;
            color: #e65100;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .lienzo-contenedor {
            border: 2px dashed #90caf9;
            border-radius: 5px;
            background-color: #fafafa;
            touch-action: none;
            margin-bottom: 10px;
            text-align: center;
        }
        canvas {
            width: 100%;
            height: 180px;
            display: block;
            cursor: crosshair;
        }
        .botones {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-limpiar {
            background-color: #e0e0e0;
            color: #333;
        }
        .btn-enviar {
            background-color: #2e7d32;
            color: white;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Firma DocumentaciÃ³n CAE</h2>

    <div class="datos-trabajador">
        <strong>Trabajador:</strong> {{ nombre }}<br>
        <strong>DNI:</strong> {{ dni }}
    </div>

    <div class="declaracion">
        Por la presente, el trabajador declara haber recibido los salarios correspondientes al periodo <strong>{{ mes }}</strong>.
    </div>

    <form id="formFirma" action="/guardar_firma" method="POST">
        <input type="hidden" name="dni" value="{{ dni }}">
        <input type="hidden" name="mes" value="{{ mes }}">
        <input type="hidden" id="imagen_firma" name="imagen_firma">

        <label style="font-size: 13px; font-weight: bold; color: #555;">Realice su firma en el recuadro inferior:</label>
        <div class="lienzo-contenedor">
            <canvas id="canvasFirma"></canvas>
        </div>

        <div class="botones">
            <button type="button" class="btn btn-limpiar" onclick="limpiarFirma()">Borrar Firma</button>
            <button type="submit" class="btn btn-enviar" onclick="prepararEnvio(event)">Confirmar y Enviar</button>
        </div>
    </form>
</div>

<script>
    const canvas = document.getElementById('canvasFirma');
    const ctx = canvas.getContext('2d');
    let dibujando = false;

    // Ajustar resoluciÃ³n del canvas al tamaÃ±o del contenedor
    function ajustarCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
    }
    window.addEventListener('load', ajustarCanvas);

    function obtenerPosicion(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function empezarDibujo(e) {
        e.preventDefault();
        dibujando = true;
        const pos = obtenerPosicion(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function dibujar(e) {
        if (!dibujando) return;
        e.preventDefault();
        const pos = obtenerPosicion(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function pararDibujo() {
        dibujando = false;
    }

    // Eventos RatÃ³n
    canvas.addEventListener('mousedown', empezarDibujo);
    canvas.addEventListener('mousemove', dibujar);
    canvas.addEventListener('mouseup', pararDibujo);
    canvas.addEventListener('mouseleave', pararDibujo);

    // Eventos TÃ¡ctiles (MÃ³viles / Tablets)
    canvas.addEventListener('touchstart', empezarDibujo);
    canvas.addEventListener('touchmove', dibujar);
    canvas.addEventListener('touchend', pararDibujo);

    function limpiarFirma() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function prepararEnvio(e) {
        const firmaData = canvas.toDataURL('image/png');
        document.getElementById('imagen_firma').value = firmaData;
    }
</script>

</body>
</html>
